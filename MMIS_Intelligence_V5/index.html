function exportRows(){let rows=dataRowsForPage();if(state.page==='requests'){rows=rows.filter(r=>(state.secondary==='ALL'||r.priority===state.secondary)&&(state.tab==='all'||(state.tab==='mine'&&r.assignedTo==='Admin A')||(state.tab==='overdue'&&pastDue(r))||(state.tab==='unassigned'&&r.assignedTo==='Unassigned')))}if(state.page==='imports'&&state.filter!=='ALL')rows=rows.filter(r=>r.status===state.filter||(state.filter==='NEEDS_ACTION'&&['BLOCKED','NEEDS_REVIEW'].includes(r.status)));
if(state.page==='gate'&&state.filter!=='ALL')rows=rows.filter(r=>r.stage===state.filter||(state.filter==='VARIANCE'&&r.variance>0)||(state.filter==='VAT'&&r.vatEvidence!=='CONFIRMED'));
if(state.page==='facility'&&state.filter!=='ALL')rows=rows.filter(r=>r.type===state.filter||(state.filter==='GAP'&&r.occupancy==='OCCUPIED'&&!r.contractActive)||(state.filter==='CONTRACT'&&r.contractActive));
if(state.page==='vendor'&&state.filter!=='ALL')rows=rows.filter(v=>v.status===state.filter||(state.filter==='UNASSIGNED'&&!D.facilities.some(f=>f.vendorId===v.id))||(state.filter==='HELD'&&D.invoices.some(i=>i.vendorId===v.id&&i.held>0))||(state.filter==='OVERDUE'&&D.invoices.some(i=>i.vendorId===v.id&&i.balance>0&&i.dueAt<'2026-11-10')));
if(state.page==='supplier'&&state.filter!=='ALL')rows=rows.filter(s=>s.status===state.filter||(state.filter==='KYC'&&['PENDING','UNDER_REVIEW'].includes(s.kyc)));
if(state.page==='staff'&&state.filter!=='ALL')rows=rows.filter(s=>s.role===state.filter||(state.filter==='RESTRICTED'&&(s.readOnly||s.status==='SUSPENDED')));
return rows}
function csv(exportId){let rows=TABLE_CACHE[exportId]||exportRows();if(!rows.length){toast('No matching rows to export.');return}const cols=Object.keys(rows[0]);const quote=v=>'"'+String(v===undefined?'':typeof v==='object'?JSON.stringify(v):v).replace(/"/g,'""')+'"';let text=[cols.join(','),...rows.map(r=>cols.map(c=>quote(r[c])).join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=`mmis-v5-${state.page}-${state.market}-sample.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(`Exported ${rows.length} illustrative rows. No live MMIS data used.`)}
function inspect(kind,id){const all={market:D.markets,vendor:D.vendors,facility:D.facilities,supplier:D.suppliers,staff:D.staff,token:D.tokens,import:D.imports,request:D.requests,order:D.orders,catalog:C};let item=(all[kind]||[]).find(x=>String(x.id)===String(id));if(!item){toast('Record not available in this illustrative dataset.');return}
if(kind!=='catalog'&&!['supplierBusiness','vendorBusiness'].includes(state.page)&&state.market!=='ALL'&&item.marketId&&item.marketId!==state.market){toast('Record is outside the authorized Market.');return}
let parts=[],route='Source record (prototype only)';
const add=(label,value)=>parts.push(`<div class="kv"><div>${esc(label)}</div><div>${esc(value===undefined||value===null?'Not recorded':value)}</div></div>`);
let title=item.name||item.title||item.vendorName||item.id;add('Record / evidence ID',id);
if(kind==='request'){
route=item.sourceRoute;title=item.title;add('Category',item.categoryLabel);add('Status',typeName(item.status));add('Market',marketName(item.marketId));add('Submitted by',item.actor);add('Priority',item.priority);add('Assigned reviewer',item.assignedTo);add('Created',date(item.createdAt));add('Due date',date(item.dueAt));add('SLA status',pastDue(item)?'PAST DUE':'Within due date');add('Source reference',item.sourceId);add('Evidence required',item.evidence);
if(item.category==='RENTAL')add('Approval prerequisites','TIN verified or authorized SuperAdmin override; Stock clearance confirmed; reviewed applicant and Facility eligibility');
if(item.category==='RECONCILIATION')add('Workflow caveat','Review case is distinct from webhook processing and from payment-source reconciliation.');
if(item.category==='SUPPORT')add('UI route status','Backend tickets exist; corresponding frontend ticket detail route was not verified on reviewed dev_basic.');
}else if(kind==='market') {route='/markets (Registry)';add('Market code',item.code);add('City',item.city);add('MarketMaster',item.manager);add('Status',item.status);add('Physical units',D.facilities.filter(f=>f.marketId===item.id).length);add('Open cases',D.requests.filter(r=>r.marketId===item.id&&pending(r)).length)}
else if(kind==='vendor'){route='/vendors/list';let f=D.facilities.find(f=>f.vendorId===item.id),ivs=D.invoices.filter(i=>i.vendorId===item.id);add('Market',marketName(item.marketId));add('Account',item.status);add('KYC',item.kyc);add('Provenance',item.source);add('Assigned Facility',f?.id||'None');add('Active Contract',String(Boolean(f?.contractActive)));add('Issued invoices',ivs.length);add('Billed',money(billed(ivs)));add('Verified allocations',money(applied(ivs)));add('Unpaid invoices',money(unpaid(ivs)));add('Overdue invoices',ivs.filter(i=>i.balance>0&&i.dueAt<'2026-11-10').length)}
else if(kind==='facility'){route='/shops';let ivs=D.invoices.filter(i=>i.facilityId===item.id);add('Market',marketName(item.marketId));add('Unit Type',typeName(item.type));add('Location',item.level+' / '+item.section);add('Recorded occupancy',item.occupancy);add('Vendor assignment',item.vendorId||'Unassigned');add('Active Contract',String(item.contractActive));add('Monthly Contract rate',money(item.monthlyRent));add('Billed',money(billed(ivs)));add('Applied',money(applied(ivs)));add('Unpaid',money(unpaid(ivs)));add('Condition',item.condition)}
else if(kind==='supplier'){route='/suppliers/list';add('Home Market',marketName(item.marketId));add('Eligible Markets',item.markets.map(marketName).join(', '));add('Supplier category',item.category);add('Account status',item.status);add('KYC',item.kyc);add('TIN evidence',item.tin);add('PO commitments',D.orders.filter(x=>x.supplierId===item.id).length);add('On-time indicator','Illustrative only; requires verified PO due/receipt denominator')}
else if(kind==='order'){route='/requisitions (PO-linked extension)';add('Market',marketName(item.marketId));add('Supplier',item.supplierId);add('Vendor',item.vendorId);add('PO state',item.status);add('Category',item.category);add('Commitment value',money(item.value));add('Due date',date(item.dueAt));add('Ordered qty',item.quantity);add('Received qty',item.received);add('Quality',item.quality);let tok=D.tokens.find(t=>t.poId===item.id);add('Linked Gate token',tok?.id||'Not linked in sample')}
else if(kind==='token'){route='/gate-control';add('Market',marketName(item.marketId));add('Gate',item.gate);add('Supplier',item.supplierId);add('PO',item.poId);add('Token lifecycle state',item.stage);add('Brought quantity',item.brought);add('Verified quantity',item.verified);add('Quantity variance',item.variance);add('VAT evidence',item.vatEvidence);add('Custody status',item.stage==='ITEMS_RECORDED'?'Awaiting Stock verification':'Source evidence required')}
else if(kind==='staff'){route=item.role==='MarketMaster'?'/users/marketmasters (SuperAdmin)':'/staff/gate-staff';add('Market',marketName(item.marketId));add('Role',item.role);add('Account status',item.status);add('Effective permission flag',item.readOnly?'Read-only':'Full access (subject to server permissions)');add('Shift',item.shift);add('Invitation',item.invitation);add('Governance','Assignment and action permissions must be enforced by the authenticated backend')}
else if(kind==='import'){route='/vendors/imported-data';add('Market',marketName(item.marketId));add('Batch',item.batchId);add('Review stage',item.status);add('Issue',item.issue);add('Source reporting month',item.sourceMonth);add('Reviewer',item.reviewer);add('Promotion safeguard','Reviewed eligibility, canonical identity and Facility ownership before consolidation')}
else if(kind==='catalog'){route=({Vendor:'/vendors/overview',Facility:'/shops/insights',Supplier:'/suppliers/overview',Staff:'/staff/overview','Cross-domain':'/dashboard'})[item.domain]||'/dashboard';add('Domain',item.domain);add('Category',item.category);add('Priority',item.priority);add('Evidence maturity',item.maturity);add('Expected drill-down',item.drilldown);add('Metric availability','Proposed design definition; not live aggregate data')}
const doc=`<div class="drawer-header"><div><span class="tag info">${esc(kind.toUpperCase())} · SAMPLE</span><h2>${esc(title)}</h2><p>Source evidence and allowable follow-up (prototype, no backend writes)</p></div><button class="btn small" data-action="close-drawer" aria-label="Close detail drawer">Close ×</button></div><div class="notice" style="margin-top:18px">No mutation or approval is performed here. Source actions require authenticated MMIS verification and role permissions.</div>${parts.join('')}<div class="drawer-actions"><button class="btn dark" data-action="route:preview" data-route="${esc(route)}">Inspect source route ↗</button><button class="btn" data-action="close-drawer">Return to results</button></div>`;
state.drawer={kind,id,html:doc};renderDrawer();}
function renderDrawer(){let slot=$('drawer-slot');if(!slot)return;if(!state.drawer){slot.innerHTML='';return}slot.innerHTML=`<div class="drawer-wrap" data-overlay="1"><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(state.drawer.kind)} source detail" tabindex="-1">${state.drawer.html}</div></div>`;slot.querySelector('.drawer')?.focus()}
function render(){if(!permitted(state.page)){state.page=allowed()[0]?.key||'global'}
const pages=allowed(),where=state.market==='ALL'?'All Markets':marketName(state.market);let sb=`<div class="brand"><div class="brand-symbol">M</div><div><strong>MarketMaster</strong><small>MMIS Intelligence · V5</small></div><button class="close-mob" data-action="toggle-menu">×</button></div>`;let last='';for(const p of pages){if(p.group!==last){last=p.group;sb+=`<div class="side-group">${last==='ADMIN'?'Enterprise Intelligence':last==='BUSINESS'?'My Business':'Specifications'}</div>`}sb+=`<button type="button" class="nav ${state.page===p.key?'active':''}" data-nav="${p.key}" ${state.page===p.key?'aria-current="page"':''}><span aria-hidden="true" style="width:18px;text-align:center;font-size:18px">${p.icon}</span><span>${esc(p.name)}</span>${p.key==='requests'?`<span class="count">${reqScope().length}</span>`:''}</button>`}
sb+=`<div class="sidebar-foot">V5 design reference, not connected to MMIS API.<br>Snapshot: ${date('2026-11-10')}<br>Offline ready · No login or write actions</div>`;
$('sidebar').innerHTML=sb;$('sidebar').classList.toggle('open',state.sidebar);
$('top').innerHTML=`<button class="mobile-bar" data-action="toggle-menu" aria-label="Open navigation">☰</button><div class="top-title"><strong>${esc(titleOf(state.page))}</strong><span> / MMIS Intelligence v5</span></div><div class="top-spacer"></div><label class="top-select">Role <select id="role-select" aria-label="Preview user role">${Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label>${isAdmin()?`<label class="top-select">Market <select id="market-select" aria-label="Select Market" ${needScope()?'disabled':''}><option value="ALL" ${state.market==='ALL'?'selected':''}>All Markets</option>${D.markets.map(m=>`<option value="${m.id}" ${state.market===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}<div class="bell" aria-label="Notifications demo">♧</div><div class="top-user"><div class="avatar">${state.role==='super'?'SA':state.role==='master'?'MM':state.role==='readonly'?'RO':state.role.startsWith('vendor')?'VE':state.role.startsWith('supplier')?'SU':state.role==='gate'?'GT':'SC'}</div><div><strong class="small">${esc(ROLE_NAMES[state.role])}</strong><small>${esc(where)}</small></div></div>`;
let h='';try{h=({global:renderGlobal,markets:renderMarkets,vendor:renderVendor,facility:renderFacility,supplier:renderSupplier,staff:renderStaff,gate:renderGate,imports:renderImports,requests:renderRequests,vendorBusiness:renderVendorBusiness,supplierBusiness:renderSupplierBusiness,catalog:renderCatalog})[state.page]()}catch(e){console.error('V5_RENDER_ERROR',state.page,e);h=`<div class="notice warning">This preview section encountered a rendering error. ${esc(e.message)}</div>`}
let locked=state.role==='readonly'?`<div class="read-only" role="status">Read-only Admin preview: inspection and exports only. No approval, invitation, consolidation or mutation actions are available.</div>`:'';
$('content').innerHTML=`${locked}<div class="notice success"><span>●</span><div>V5 interactive prototype · ${esc(where)} · ${esc(ROLE_NAMES[state.role])} · Sample snapshot 10 Nov 2026 · <strong>No live MMIS data</strong></div></div>${h}<footer class="tiny muted" style="margin-top:30px;border-top:1px solid var(--line);padding-top:15px">MMIS V5 · Visual & workflow design approval · Backend source-of-truth, authorization, persistence, settlement and financial reconciliation require separate engineering acceptance.</footer>`;
renderDrawer()}
function resetList(){state.q='';state.filter='ALL';state.secondary='ALL';state.tablePage=1;render()}
function handleAction(act,node){if(act.startsWith('nav:'))return navTo(act.split(':')[1]);if(act.startsWith('drill:')){let [_,page,value]=act.split(':');if(page==='requests'&&value==='overdue'){navTo('requests');state.tab='overdue';render();return}
let target=value.toUpperCase();if(page==='facility'&&target==='OCCUPIED'){navTo(page,{secondary:'OCCUPIED'});return}if(page==='facility'&&target==='GAP')target='GAP';if(page==='facility'&&target==='ALL')target='ALL';if(page==='gate'&&target==='VARIANCE')target='VARIANCE';if(page==='gate'&&target==='VAT')target='VAT';if(page==='staff'&&target==='UNCOVERED')return navTo('staff');if(page==='vendor'&&target==='CONTRACT')target='ALL';if(page==='vendor'&&target==='ALL')target='ALL';if(page==='supplier'&&target==='LATE'){navTo(page,{filter:'LATE'});return}if(page==='supplier'&&target==='ORDERS'){navTo(page,{filter:'ORDERS'});return}navTo(page,{filter:target});return}
if(act==='prev'){state.tablePage=Math.max(1,state.tablePage-1);render();return}if(act==='next'){state.tablePage++;render();return}if(act==='reset-filters'){resetList();return}if(act==='reset-catalog'){state.catalogDomain='ALL';state.catalogPriority='ALL';state.catalogMaturity='ALL';state.q='';render();return}if(act==='toggle-menu'){state.sidebar=!state.sidebar;render();return}if(act==='close-drawer'){state.drawer=null;renderDrawer();return}if(act==='export'){csv(node.dataset.export);return}
if(act.startsWith('route:')){let route=act==='route:preview'?node.dataset.route:ROUTES[act.split(':')[1]]||'Not verified';if(act==='route:marketmasters')route='/users/marketmasters (SuperAdmin only)';toast(`Source path: ${route}. This is a design prototype; production navigation is not enabled.`);return}
if(act.startsWith('demo:')){const route={shops:'/available-shops',applications:'/my-rental-applications',requisitions:'/requisitions',profile:'/supplier/profile (proposed)'}[act.slice(5)];toast(`Proposed authenticated navigation: ${route}. No live route opened.`);return}}
let inputTimer;
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-nav],[data-category],[data-unit],[data-scope],[data-open],[data-row],[data-req-tab],[data-overlay]');if(!target)return;
if(target.dataset.action){handleAction(target.dataset.action,target);return}if(target.dataset.nav){navTo(target.dataset.nav);return}if(target.dataset.category){navTo('requests',{filter:target.dataset.category});return}if(target.dataset.unit){navTo('facility',{filter:target.dataset.unit});return}if(target.dataset.scope){changeMarket(target.dataset.scope);navTo('markets');return}if(target.dataset.reqTab){state.tab=target.dataset.reqTab;state.tablePage=1;render();return}if(target.dataset.open){inspect(target.dataset.open,target.dataset.id);return}if(target.dataset.row&&!e.target.closest('button')){inspect(target.dataset.row,target.dataset.id);return}if(target.dataset.overlay&&e.target===target){state.drawer=null;renderDrawer()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){state.drawer=null;renderDrawer()}if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-row]')&&!e.target.closest('button')){e.preventDefault();let tr=e.target.closest('[data-row]');inspect(tr.dataset.row,tr.dataset.id)}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='role-select'){switchRole(x.value);return}if(x.id==='market-select'){changeMarket(x.value);return}if(x.dataset.f){state[x.dataset.f]=x.value;state.tablePage=1;render();return}});
document.addEventListener('input',e=>{let x=e.target;if(x.dataset.f!=='q')return;clearTimeout(inputTimer);const value=x.value;inputTimer=setTimeout(()=>{state.q=value;state.tablePage=1;render();let el=document.querySelector('#content [data-f="q"]');if(el){el.focus();el.setSelectionRange?.(value.length,value.length)}},160)});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==state.page&&permitted(p))navTo(p)});
const initial=location.hash.slice(1);if(initial&&permitted(initial))state.page=initial;render();
window.__MMIS_V5={getState:()=>({...state}),data:D,openPage:navTo,role:switchRole};
})();
</script></body></html>
